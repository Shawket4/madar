name: CI

on:
  push:
    branches: [main]
  pull_request:

# The Rust core lives IN THIS REPO at rust-core/ — every Flutter package
# points at it (packages/rust_bridge/flutter_rust_bridge.yaml: rust_root
# ../../rust-core/crates/madar-frb; the android/ios/macos build files use the
# same relative path). It used to live in the separate madar-pos repo, which
# is why this workflow checked out a sibling copy; that copy is stale and no
# longer compiles, so the build is now entirely in-tree.

permissions:
  contents: write # the format step commits formatting back to the branch

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    # The two host libraries the Flutter tests load, built once and handed to
    # every test job: libmadar_frb.so (the POS bridge's host tests) and
    # libmadar_frb_dashboard.so (the dashboard's business rules: every
    # dashboard package's tests FAIL without it, loadRulesForTest). Release,
    # not debug: the tests load target/release, and a debug target is several GB.
    name: Host libraries (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # madar-shared is private: with MADAR_SHARED_TOKEN set, cargo fetches it
      # through the git CLI with the token; with the secret empty this is a no-op
      # (anonymous fetch, as before). GIT_CONFIG_* also reaches Docker actions.
      - name: Authenticate to private madar-shared
        shell: bash
        env:
          MADAR_SHARED_TOKEN: ${{ secrets.MADAR_SHARED_TOKEN }}
        run: |
          if [ -n "$MADAR_SHARED_TOKEN" ]; then
            base=https://github.com/Shawket4/madar-shared
            git config --global url."https://x-access-token:${MADAR_SHARED_TOKEN}@github.com/Shawket4/madar-shared".insteadOf "$base"
            {
              echo CARGO_NET_GIT_FETCH_WITH_CLI=true
              echo GIT_CONFIG_COUNT=1
              echo "GIT_CONFIG_KEY_0=url.https://x-access-token:${MADAR_SHARED_TOKEN}@github.com/Shawket4/madar-shared.insteadOf"
              echo "GIT_CONFIG_VALUE_0=$base"
            } >> "$GITHUB_ENV"
          fi

      # rust-toolchain.toml pins the toolchain and every cross-compile target,
      # so rustup provisions exactly what the app ships with.
      - name: Setup Rust (from rust-toolchain.toml)
        working-directory: rust-core
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
          key: host-libs

      - name: Build the host libraries
        working-directory: rust-core
        run: cargo build -p madar_frb -p madar_frb_dashboard --release

      - uses: actions/upload-artifact@v4
        with:
          name: host-libs
          path: |
            rust-core/target/release/libmadar_frb.so
            rust-core/target/release/libmadar_frb_dashboard.so
          if-no-files-found: error
          retention-days: 1

  analyze:
    name: Analyze + format
    runs-on: ubuntu-latest
    steps:
      # On a PR, check out the branch itself (not the merge commit) so the
      # formatting step below can commit to it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Pub get
        run: dart pub get

      - name: Analyze
        run: flutter analyze .

      # Formats the Dart code instead of failing on it (owner, 2026-09-25: the
      # failing format check kept breaking CI). Anything `dart format` changes is
      # committed back to the branch by github-actions[bot] (main on a push, the
      # PR branch on a pull request). A push made with GITHUB_TOKEN starts no new
      # workflow run, so this cannot loop. A PR from a fork cannot be pushed to,
      # so there it only warns.
      - name: Format (auto-fix and commit)
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          git ls-files '*.dart' | grep -v '/cargokit/' | xargs dart format > /dev/null
          if git diff --quiet; then echo "Dart code already formatted."; exit 0; fi
          echo "dart format changed:"; git diff --stat
          if [ "$FORK" = "true" ]; then
            echo "::warning::A fork's branch can't be pushed to: run dart format locally."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -am "style: dart format (CI)"
          for i in 1 2 3; do
            git push -q origin "HEAD:$BRANCH" && { echo "Pushed the formatting to $BRANCH."; exit 0; }
            git pull -q --rebase origin "$BRANCH" || { git rebase --abort; break; }
          done
          echo "::warning::Could not push the formatting to $BRANCH; it will be formatted on the next run."

  host:
    # The bridge smoke tests against the real POS library, and the POS shell
    # board's full matrix. The QA E2E suites live in qa_test/ (they need a
    # live backend) and are not loaded here.
    name: Bridge host tests + POS shell board
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: host-libs
          path: rust-core/target/release

      # The suite calls markTestSkipped() when the library is missing, so a
      # wrong path would pass green while testing nothing. Fail loudly instead.
      - name: Assert the library is where the tests look for it
        run: |
          LIB=rust-core/target/release/libmadar_frb.so
          [ -f "$LIB" ] || { echo "::error::$LIB is missing: the host suite would silently skip."; exit 1; }
          echo "Found $LIB ($(du -h "$LIB" | cut -f1))"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Pub get
        run: dart pub get

      - name: Host tests
        working-directory: packages/rust_bridge
        run: flutter test

      # apps/madar's shell board lays out its whole matrix (every device ×
      # en/ar × light/dark) only with MADAR_RENDER on; the package run lays out
      # the cheap subset. This lays out the rest (and writes the PNGs, unused).
      - name: POS shell board, full matrix (MADAR_RENDER)
        working-directory: apps/madar
        run: |
          flutter test test/shell_render_test.dart --dart-define=MADAR_RENDER=true --plain-name 'board: '

  packages:
    # EVERY Flutter package with tests (owner, 2026-10-11: CI runs every
    # test): the POS app and its packages, the dashboard app and its packages,
    # and any package added later, found by its pubspec.yaml. Split over
    # parallel shards by tool/ci_test_shard.py (balanced by test count); the
    # staff app's tree runs in staff-ci.yml, packages/rust_bridge in `host`.
    name: Package tests (${{ matrix.shard }}/6)
    needs: native
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: host-libs
          path: rust-core/target/release

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Pub get
        run: dart pub get

      - name: Tests
        run: |
          set -e
          pkgs=$(python3 tool/ci_test_shard.py ${{ matrix.shard }} 6)
          echo "This shard: $(echo $pkgs)"
          for p in $pkgs; do
            echo "── $p"
            (cd "$p" && flutter test)
          done

  rust:
    # Every Rust test in the repo: all five rust-core crates (unit,
    # integration and doc tests; madar-frb-dashboard and madar-frb-staff
    # have their own), madar_kitchen_ffi included. The old-client harness
    # (tool/old_client_api_check) is the next job.
    # Not here, on purpose: madar-core's `backend-tests` suites (they drive a
    # LIVE backend: tool/offline_b_backend.sh) and its `probes` (manual
    # #[ignore]d timing/PNG dumps).
    name: Rust tests (every crate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # madar-shared is private: with MADAR_SHARED_TOKEN set, cargo fetches it
      # through the git CLI with the token; with the secret empty this is a no-op
      # (anonymous fetch, as before). GIT_CONFIG_* also reaches Docker actions.
      - name: Authenticate to private madar-shared
        shell: bash
        env:
          MADAR_SHARED_TOKEN: ${{ secrets.MADAR_SHARED_TOKEN }}
        run: |
          if [ -n "$MADAR_SHARED_TOKEN" ]; then
            base=https://github.com/Shawket4/madar-shared
            git config --global url."https://x-access-token:${MADAR_SHARED_TOKEN}@github.com/Shawket4/madar-shared".insteadOf "$base"
            {
              echo CARGO_NET_GIT_FETCH_WITH_CLI=true
              echo GIT_CONFIG_COUNT=1
              echo "GIT_CONFIG_KEY_0=url.https://x-access-token:${MADAR_SHARED_TOKEN}@github.com/Shawket4/madar-shared.insteadOf"
              echo "GIT_CONFIG_VALUE_0=$base"
            } >> "$GITHUB_ENV"
          fi

      - name: Setup Rust (from rust-toolchain.toml)
        working-directory: rust-core
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust-core
          key: rust-all

      - name: rust-core workspace tests
        working-directory: rust-core
        run: cargo test --workspace --locked

      # Every default clippy lint was cleared on 2026-10-16; this keeps it so.
      - name: rust-core clippy
        working-directory: rust-core
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-deny:
    # rust-core/deny.toml: RustSec advisories, licences, duplicates, sources.
    name: cargo-deny (rust-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # madar-shared is private: with MADAR_SHARED_TOKEN set, cargo fetches it
      # through the git CLI with the token; with the secret empty this is a no-op
      # (anonymous fetch, as before). GIT_CONFIG_* also reaches Docker actions.
      - name: Authenticate to private madar-shared
        shell: bash
        env:
          MADAR_SHARED_TOKEN: ${{ secrets.MADAR_SHARED_TOKEN }}
        run: |
          if [ -n "$MADAR_SHARED_TOKEN" ]; then
            base=https://github.com/Shawket4/madar-shared
            git config --global url."https://x-access-token:${MADAR_SHARED_TOKEN}@github.com/Shawket4/madar-shared".insteadOf "$base"
            {
              echo CARGO_NET_GIT_FETCH_WITH_CLI=true
              echo GIT_CONFIG_COUNT=1
              echo "GIT_CONFIG_KEY_0=url.https://x-access-token:${MADAR_SHARED_TOKEN}@github.com/Shawket4/madar-shared.insteadOf"
              echo "GIT_CONFIG_VALUE_0=$base"
            } >> "$GITHUB_ENV"
          fi

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust-core/Cargo.toml
          command: check
          arguments: --all-features --config rust-core/deny.toml

  kitchen:
    # Madar Kitchen (apps/kitchen, React Native): the TypeScript check and its
    # unit tests. The native core module is not built here; its Rust side is
    # tested in the rust job (madar_kitchen_ffi).
    name: Kitchen app (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kitchen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/kitchen/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  old-clients:
    # tool/old_client_api_check.sh: the madar-api models of every POS release
    # still in the field (v0.5.0, v0.5.1, v0.6.0, v0.6.1) must decode the
    # backend's golden responses (MadarRust tests/fixtures/legacy_till_api).
    # It builds each release from its tag, so it needs the full history, and
    # the backend checkout beside this one.
    name: Old-client API check (golden responses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: madar
          fetch-depth: 0

      # MadarRust is private: the shared token reads it (the default token
      # sees only this repo); with the secret empty, the default as before.
      - uses: actions/checkout@v7
        with:
          repository: Shawket4/MadarRust
          path: MadarRust
          sparse-checkout: tests/fixtures
          token: ${{ secrets.MADAR_SHARED_TOKEN || github.token }}
      # madar-shared is private: with MADAR_SHARED_TOKEN set, cargo fetches it
      # through the git CLI with the token; with the secret empty this is a no-op
      # (anonymous fetch, as before). GIT_CONFIG_* also reaches Docker actions.
      - name: Authenticate to private madar-shared
        shell: bash
        env:
          MADAR_SHARED_TOKEN: ${{ secrets.MADAR_SHARED_TOKEN }}
        run: |
          if [ -n "$MADAR_SHARED_TOKEN" ]; then
            base=https://github.com/Shawket4/madar-shared
            git config --global url."https://x-access-token:${MADAR_SHARED_TOKEN}@github.com/Shawket4/madar-shared".insteadOf "$base"
            {
              echo CARGO_NET_GIT_FETCH_WITH_CLI=true
              echo GIT_CONFIG_COUNT=1
              echo "GIT_CONFIG_KEY_0=url.https://x-access-token:${MADAR_SHARED_TOKEN}@github.com/Shawket4/madar-shared.insteadOf"
              echo "GIT_CONFIG_VALUE_0=$base"
            } >> "$GITHUB_ENV"
          fi

      - name: Decode the golden responses with every old release
        env:
          MADAR_RUST: ${{ github.workspace }}/MadarRust
          CARGO_TARGET_DIR: ${{ github.workspace }}/old-clients-target
        run: madar/tool/old_client_api_check.sh

  windows:
    name: Windows build + host tests
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      # madar-shared is private: with MADAR_SHARED_TOKEN set, cargo fetches it
      # through the git CLI with the token; with the secret empty this is a no-op
      # (anonymous fetch, as before). GIT_CONFIG_* also reaches Docker actions.
      - name: Authenticate to private madar-shared
        shell: bash
        env:
          MADAR_SHARED_TOKEN: ${{ secrets.MADAR_SHARED_TOKEN }}
        run: |
          if [ -n "$MADAR_SHARED_TOKEN" ]; then
            base=https://github.com/Shawket4/madar-shared
            git config --global url."https://x-access-token:${MADAR_SHARED_TOKEN}@github.com/Shawket4/madar-shared".insteadOf "$base"
            {
              echo CARGO_NET_GIT_FETCH_WITH_CLI=true
              echo GIT_CONFIG_COUNT=1
              echo "GIT_CONFIG_KEY_0=url.https://x-access-token:${MADAR_SHARED_TOKEN}@github.com/Shawket4/madar-shared.insteadOf"
              echo "GIT_CONFIG_VALUE_0=$base"
            } >> "$GITHUB_ENV"
          fi

      - name: Setup Rust (from rust-toolchain.toml)
        working-directory: rust-core
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
          # A separate key from the macOS job: same workspace, different host
          # triple, and sharing the cache between them thrashes both.
          key: windows

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      # The core, for THIS host. Windows names it `madar_frb.dll` with no
      # `lib` prefix, which is why the test suites resolve the artifact by
      # platform instead of naming the macOS one.
      - name: Build host dll
        working-directory: rust-core
        run: cargo build -p madar_frb --release

      # The suites skip themselves when the library is missing, so a wrong
      # path makes this job pass green having loaded nothing. Fail loudly.
      - name: Assert the dll is where the tests look for it
        shell: pwsh
        run: |
          $dll = "rust-core/target/release/madar_frb.dll"
          if (-not (Test-Path $dll)) {
            Write-Output "::error::$dll is missing - the host suite would silently skip."
            exit 1
          }
          Write-Output "Found $dll ($((Get-Item $dll).Length) bytes)"

      - name: Pub get
        run: dart pub get

      # Rust-side unit tests. They are host-independent in principle and this
      # is where a Windows-only path, separator or line-ending assumption
      # actually shows up. The shared rules (madar-authz, madar-money,
      # madar-till, madar-units, madar-ids, madar-time, madar-sync, madar-dawam)
      # are git dependencies on madar-shared, pinned by tag; their own tests
      # and vectors run in madar-shared's CI. `--locked`
      # fails if Cargo.lock lost its `git+…?tag=` sources (a lock built with a
      # local [patch] must never land).
      - name: Core tests
        working-directory: rust-core
        run: cargo test -p madar-core --locked

      - name: Host tests
        working-directory: packages/rust_bridge
        run: flutter test

      # The desktop app itself. `flutter analyze` never touches the Windows
      # runner code, the CMake wiring or the cargokit build hook, so this is
      # the only step that answers "does the Windows app actually build".
      - name: Build the Windows app
        working-directory: apps/madar
        # `--verbose`, because a cargokit failure is otherwise UNDIAGNOSABLE
        # from CI: the plugin's Rust build runs inside an MSBuild custom step,
        # and Flutter swallows its stderr — the whole report is
        # "MSB8066 ... exited with code -1", which says a build ran and stopped
        # and nothing about why. The extra noise costs a scroll; not having it
        # costs a round trip per guess.
        run: flutter build windows --release --verbose

# cargo-deny for rust-core: advisories, licences, duplicate versions, sources.
# CI: the `rust` job in .github/workflows/ci.yml runs `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Each one with why it stays. (The zip 8 entries went 2026-11-25: rust_xlsxwriter
# 0.100+ takes zip 9, so zip 8 is out of the tree.)
ignore = [
    # ttf-parser is unmaintained; cosmic-text (receipt rendering) depends on it
    # and has no release without it.
    { id = "RUSTSEC-2026-0192", reason = "transitive via cosmic-text; no maintained alternative release yet" },
    # basic-toml is unmaintained (2026-10-23), with no replacement release. It
    # is build-time only: askama_derive reads its config with it, under
    # uniffi_bindgen. Drop this when uniffi moves to an askama without it.
    { id = "RUSTSEC-2026-0374", reason = "build-time only via uniffi -> askama_derive; no maintained release" },
    # chrono and chrono-tz are unmaintained (2026-11-25), with no maintained
    # release to move to. They are the date and zone layer of the whole system:
    # madar-shared's madar-time (the one zone rule), madar-money, madar-till,
    # madar-dawam and the core all build on them, and the backend shares them.
    # Leaving them is a cross-repo migration of its own, not a version bump.
    # No vulnerability is reported against either.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; no successor release; the shared zone rule and the core build on it" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained; no successor release; madar-time's zone database" },
]

[licenses]
version = 2
# The licences in the tree today. A new one fails until it is added here.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # madar-api only (see the clarify below).
    "LicenseRef-Proprietary",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

# The generated API client says `license = "Proprietary"` (not SPDX) and is
# not marked unpublished; it is ours.
[[licenses.clarify]]
crate = "madar-api"
expression = "LicenseRef-Proprietary"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/Shawket4/madar-shared"]

# flutter_rust_bridge wrapper over madar-core for the EMPLOYEE STAFF app.
# Binding code ONLY, no logic. A SEPARATE bindings binary from `madar-frb` (the
# teller/POS bridge) and `madar-frb-dashboard` (management): the staff app links
# this crate and exposes only the employee self-service surface, so no binary an
# employee installs carries the POS or admin surfaces (security + binary size).
# All three delegate 1:1 to the SAME shared madar-core.
[package]
# Underscore on purpose: Cargokit derives artifact names (libmadar_frb_staff.a)
# from the PACKAGE name verbatim — a hyphen breaks its artifact lookup.
name = "madar_frb_staff"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib → Android .so / desktop dylib; staticlib → iOS; lib → tests + codegen.
crate-type = ["lib", "cdylib", "staticlib"]
name = "madar_frb_staff"

[dependencies]
madar-core = { path = "../madar-core" }
# Exact pin: the cargo crate, Dart package, and codegen CLI must share one version.
flutter_rust_bridge = "=2.12.0"
thiserror = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

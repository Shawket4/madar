# flutter_rust_bridge wrapper over madar-core for the MANAGEMENT DASHBOARD app.
# Binding code ONLY, no logic. A SEPARATE bindings binary from `madar-frb` (the
# teller/POS bridge): the dashboard app links this crate and exposes only the
# admin/analytics surface, so the teller binary never carries it and vice versa
# (security + binary size). Both delegate 1:1 to the SAME shared madar-core.
[package]
# Underscore on purpose: Cargokit derives artifact names (libmadar_frb_dashboard.a)
# from the PACKAGE name verbatim — a hyphen breaks its artifact lookup.
name = "madar_frb_dashboard"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib → Android .so / desktop dylib; staticlib → iOS; lib → tests + codegen.
crate-type = ["lib", "cdylib", "staticlib"]
name = "madar_frb_dashboard"

[dependencies]
madar-core = { path = "../madar-core" }
# Exact pin: the cargo crate, Dart package, and codegen CLI must share one version.
flutter_rust_bridge = "=2.13.0"
thiserror = "2"
# The api_stream cancel handle (a oneshot per open stream).
tokio = { version = "1", features = ["sync"] }
# Spreadsheet export / import (`xlsx_write` / `xlsx_read`), dashboard only — the
# POS binary never links them. Both pure Rust, no default features.
rust_xlsxwriter = "0.99"
calamine = { version = "0.36", features = ["chrono"] }
# The export's banner logo: an org logo is stored as WebP, which the writer
# cannot embed, so it is re-encoded as PNG. Already linked through madar-core.
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The business rules the dashboard shows (api/rules.rs): madar-shared's own
# crates, the same tag as madar-core's (bump them together).
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
# Dawam's salary money crosses as f64 and is read as the exact Decimal the
# crate takes.
rust_decimal = { version = "1", default-features = false }
madar-time = { git = "https://github.com/Shawket4/madar-shared", tag = "v0.8.0" }
madar-units = { git = "https://github.com/Shawket4/madar-shared", tag = "v0.8.0" }
madar-dawam = { git = "https://github.com/Shawket4/madar-shared", tag = "v0.8.0" }
madar-ids = { git = "https://github.com/Shawket4/madar-shared", tag = "v0.8.0" }
madar-money = { git = "https://github.com/Shawket4/madar-shared", tag = "v0.8.0" }
madar-catalog = { git = "https://github.com/Shawket4/madar-shared", tag = "v0.8.0" }
madar-till = { git = "https://github.com/Shawket4/madar-shared", tag = "v0.8.0" }
madar-inventory = { git = "https://github.com/Shawket4/madar-shared", tag = "v0.8.0" }
madar-loyalty = { git = "https://github.com/Shawket4/madar-shared", tag = "v0.8.0" }
madar-plan = { git = "https://github.com/Shawket4/madar-shared", tag = "v0.8.0" }

[dev-dependencies]
# Reads the written workbook's XML in the xlsx tests (rust_xlsxwriter's own zip).
zip = { version = "8", default-features = false, features = ["deflate"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

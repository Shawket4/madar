# flutter_rust_bridge_codegen config for the DASHBOARD bridge — run via
# tool/gen-bindings-dashboard.sh (or `dart run melos run bridge_dashboard`).
# Keep the codegen CLI, this Dart package, and the madar-frb-dashboard cargo dep
# on the SAME version (currently 2.12.0).
rust_input: crate::api
rust_root: ../../rust-core/crates/madar-frb-dashboard
dart_output: lib/src/generated
dart_entrypoint_class_name: DashboardBridge
enable_lifetime: false

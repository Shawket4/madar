name: design_system
description: "Madar POS design system: ink/teal tokens, typography, MadarIcon, shared widgets, breakpoints."
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  lottie: ^3.3.2
  lucide_icons_flutter: ^3.1.14

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/brand/
    - assets/lottie/
    - assets/sounds/
  fonts:
    # ONE SUPERFAMILY for both scripts. Plex Sans Arabic carries Latin as well
    # as Arabic, so a bilingual row sits on one skeleton rather than two faces
    # meeting in the middle of it — which is what replaced Cairo here.
    #
    # There is no 800: Plex stops at Bold. `MadarType.heaviest` says so, so a
    # style cannot ask for a weight the family has not got.
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700

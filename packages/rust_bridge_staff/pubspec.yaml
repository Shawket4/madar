name: rust_bridge_staff
description: Madar employee staff-app FFI bridge to madar-core via flutter_rust_bridge (separate bindings binary from the POS and dashboard bridges).
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  # Exact version by FRB's design: must equal the codegen CLI and the
  # madar-frb-staff cargo dependency (2.12.0). Upgrade all three together.
  flutter_rust_bridge: 2.13.0
  freezed_annotation: ^3.1.0

dev_dependencies:
  build_runner: ^2.5.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1

# FFI plugin: no Dart platform code — Cargokit builds madar-frb-staff per
# platform (android/build.gradle, ios+macos podspecs, windows/CMakeLists.txt).
flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true

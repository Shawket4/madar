name: madar_workspace
description: Madar POS Flutter monorepo — a thin, high-performance UI over the shared Rust core.
publish_to: none

environment:
  sdk: ^3.11.0

workspace:
  - apps/madar
  - apps/dashboard
  - apps/staff
  - packages/app_core
  - packages/design_system
  - packages/rust_bridge
  - packages/rust_bridge_dashboard
  - packages/dashboard_api
  - packages/dashboard_kit
  - packages/dashboard_core
  - packages/dashboard_features/overview
  - packages/dashboard_features/sell
  - packages/dashboard_features/catalog_menu
  - packages/dashboard_features/catalog_offers
  - packages/dashboard_features/reports
  - packages/dashboard_features/inventory
  - packages/dashboard_features/team
  - packages/dashboard_features/setup
  - packages/dashboard_features/admin
  - packages/rust_bridge_staff
  - packages/staff_core
  - packages/features/dawam_auth
  - packages/features/dawam_clock
  - packages/features/dawam_schedule
  - packages/features/dawam_requests
  - packages/features/dawam_team
  - packages/features/dawam_pay
  - packages/features/auth
  - packages/features/checkout
  - packages/features/history
  - packages/features/incoming
  - packages/features/kds
  - packages/features/order
  - packages/features/settings
  - packages/features/till

dev_dependencies:
  melos: ^8.0.0
  # 10.3.x needs Dart >=3.12; this resolves to the newest release our SDK supports.
  very_good_analysis: ^11.0.0

melos:
  scripts:
    analyze:
      run: flutter analyze .
      description: Static analysis for the whole workspace.
    format:
      # Skips the vendored cargokit package (its own analysis_options, not our
      # code to restyle) — must stay in step with .github/workflows/ci.yml.
      run: git ls-files '*.dart' | grep -v '/cargokit/' | xargs dart format --set-exit-if-changed --output=none
      description: Verify formatting across the workspace.
    test:
      # One package at a time: parallel `flutter` processes queue on the
      # tool's startup lock and melos prints every "Waiting for another
      # flutter command" line as an ERROR. --no-pub: `melos bootstrap`
      # already resolved the workspace, so each package need not re-resolve.
      run: melos exec --dir-exists=test --fail-fast --concurrency=1 -- flutter test --no-pub
      description: Run every package's tests.
    gen:
      run: melos exec --depends-on=build_runner -- dart run build_runner build --delete-conflicting-outputs
      description: Run build_runner codegen where configured.
    bridge:
      run: tool/gen-bindings.sh
      description: Regenerate flutter_rust_bridge bindings from madar-frb (M1+).
    bridge_dashboard:
      run: tool/gen-bindings-dashboard.sh
      description: Regenerate FRB bindings from madar-frb-dashboard (management dashboard app).
    bridge_staff:
      run: tool/gen-bindings-staff.sh
      description: Regenerate FRB bindings from madar-frb-staff (employee staff app).
    gen_dashboard_api:
      run: python3 tool/gen_dashboard_api.py
      description: Regenerate packages/dashboard_api's Dart client, models and test fixtures from its spec/openapi.json.

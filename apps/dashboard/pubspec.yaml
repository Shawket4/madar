name: madar_dashboard
description: "Madar management dashboard — native Flutter app, a thin Riverpod UI over the shared madar-core (via the dashboard FRB bindings)."
publish_to: 'none'
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Shared workspace packages — the dashboard's OWN bindings binary (not the POS
  # rust_bridge) + the shared design system. Deliberately NOT app_core (it pulls
  # bluetooth/printer deps) — the dashboard defines its own lean providers.
  rust_bridge_dashboard: ^0.1.0
  design_system: ^0.1.0
  dashboard_api: ^0.1.0
  dashboard_kit: ^0.1.0
  dashboard_core: ^0.1.0
  dashboard_overview: ^0.1.0
  dashboard_sell: ^0.1.0
  dashboard_catalog_menu: ^0.1.0
  dashboard_catalog_offers: ^0.1.0
  dashboard_reports: ^0.1.0
  dashboard_inventory: ^0.1.0
  dashboard_team: ^0.1.0
  dashboard_setup: ^0.1.0
  dashboard_admin: ^0.1.0

  # State (house pattern: hand-written Notifier/AsyncNotifier).
  flutter_riverpod: ^3.3.2
  go_router: ^18.0.1
  fl_chart: ^1.2.0
  intl: ^0.20.2
  path_provider: ^2.1.0
  table_calendar: ^3.2.0
  file_picker: ^13.1.0
  file_selector: ^1.1.0
  share_plus: ^13.3.1
  image_picker: ^1.2.4
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/

# Native launch splash, the same as the POS's (apps/madar/pubspec.yaml): the
# Madar orbit on Paper, on Ink in dark mode, from the Madar Design System kit's
# app/splash/. splash_icon*.png is the 150 pt square at @4x; android12_icon*.png
# is 1152 px with the artwork inside the 768 px circle.
# Regenerate: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#EFF3F4"
  color_dark: "#14181E"
  image: assets/branding/splash_icon.png
  image_dark: assets/branding/splash_icon_dark.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#EFF3F4"
    color_dark: "#14181E"
    image: assets/branding/android12_icon.png
    image_dark: assets/branding/android12_icon_dark.png
    icon_background_color: "#EFF3F4"
    icon_background_color_dark: "#14181E"

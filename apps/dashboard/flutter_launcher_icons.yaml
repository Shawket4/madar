# App icons for every platform, from the Madar brand tile (symbol on teal).
# Regenerate: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/branding/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  macos:
    generate: true
    image_path: "assets/branding/icon.png"
  windows:
    generate: true
    image_path: "assets/branding/icon.png"
    icon_size: 256

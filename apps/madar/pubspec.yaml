name: madar
description: Madar Cashier — a thin, high-performance Flutter UI over the shared Rust core.
# Store version: `1.0.0` is the marketing version (CFBundleShortVersionString /
# versionName); `+1` is the build number (CFBundleVersion / versionCode). Bump
# the build number on EVERY upload to TestFlight / Play — both stores refuse a
# reused one. CI may override with `--build-number=$GITHUB_RUN_NUMBER`.
version: 0.11.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  app_core: ^0.1.0
  audioplayers: ^6.1.0
  bonsoir: ^7.1.5
  connectivity_plus: ^7.2.0
  design_system: ^0.1.0
  feature_auth: ^0.1.0
  feature_checkout: ^0.1.0
  feature_history: ^0.1.0
  feature_incoming: ^0.1.0
  feature_kds: ^0.1.0
  feature_order: ^0.1.0
  feature_settings: ^0.1.0
  feature_till: ^0.1.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.0.1
  # Material's own words (text-field Cut/Copy/Paste, tooltips) in the app's
  # language, flipping with it.
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  # Direct (not just transitive via rust_bridge) so observability.dart may
  # name the FRB exception types it tags Rust-core failures by.
  flutter_rust_bridge: 2.13.0
  # The app's own version (pubspec `version`, as the platform bundle carries
  # it) for the core's `X-Madar-Client` header. Already linked via Sentry.
  package_info_plus: ^10.2.1
  path_provider: ^2.1.5
  rust_bridge: ^0.1.0
  # Crash/error reporting to the SELF-HOSTED Sentry at sentry.madar-pos.cloud.
  # Init lives in main.dart; it is inert when SENTRY_DSN is empty.
  sentry_flutter: ^9.28.0
  shared_preferences: ^2.5.3

# Launcher icons and the native splash are copied by hand from the Madar Design
# System kit (`Madar Design System/app/`, generated by its tools/export.sh) rather
# than generated here — see android res/, ios + macos Assets.xcassets, windows
# runner/resources.
dev_dependencies:
  fake_async: ^1.3.3
  flutter_native_splash: ^2.4.6
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

# The splash the native resources were made from (the Madar Design System kit's
# app/splash/): the orbit on Paper, on Ink in dark mode. splash_icon*.png is the
# 150 pt square at @4x; android12_icon*.png is 1152 px with the artwork inside
# the 768 px circle. Re-running the generator gives the same splash (it resamples
# the PNGs itself, so expect pixel-level diffs only).
flutter_native_splash:
  color: "#EFF3F4"
  color_dark: "#14181E"
  image: assets/brand/splash_icon.png
  image_dark: assets/brand/splash_icon_dark.png
  android_12:
    color: "#EFF3F4"
    color_dark: "#14181E"
    image: assets/brand/android12_icon.png
    image_dark: assets/brand/android12_icon_dark.png
    icon_background_color: "#EFF3F4"
    icon_background_color_dark: "#14181E"

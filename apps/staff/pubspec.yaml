name: madar_staff
description: "Dawam by Madar — the staff app shell: boot, theme, tabs. Features live in packages/features/dawam_*, the spine in packages/staff_core."
publish_to: 'none'
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  design_system: ^0.1.0
  feature_dawam_auth: ^0.1.0
  feature_dawam_clock: ^0.1.0
  feature_dawam_pay: ^0.1.0
  feature_dawam_requests: ^0.1.0
  feature_dawam_schedule: ^0.1.0
  feature_dawam_team: ^0.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  intl: ^0.20.2
  path_provider: ^2.1.5
  # The staff app's OWN bindings binary — not the POS `rust_bridge`: this
  # lands on every employee's personal phone.
  rust_bridge_staff: ^0.1.0
  shared_preferences: ^2.5.3
  staff_core: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

name: madar_staff
description: "Dawam by Madar — the staff app shell: boot, theme, tabs. Features live in packages/features/dawam_*, the spine in packages/staff_core."
publish_to: 'none'
version: 1.0.1+1
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  battery_plus: ^7.1.1
  design_system: ^0.1.0
  feature_dawam_auth: ^0.1.0
  feature_dawam_clock: ^0.1.0
  feature_dawam_pay: ^0.1.0
  feature_dawam_requests: ^0.1.0
  feature_dawam_schedule: ^0.1.0
  feature_dawam_team: ^0.1.0
  # Push notifications (APP-6); the project is `dawam-by-madar`.
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  # The phone's Dawam device token lives in the Keychain / Android Keystore,
  # never the core's SQLite (RO-3, audit 03 CL-1c).
  flutter_secure_storage: ^11.2.0
  # The clock-in position and the on-shift pings (CL-1, CL-6).
  geolocator: ^14.0.3
  intl: ^0.20.2
  path_provider: ^2.1.5
  # The staff app's OWN bindings binary — not the POS `rust_bridge`: this
  # lands on every employee's personal phone.
  rust_bridge_staff: ^0.1.0
  shared_preferences: ^2.5.3
  staff_core: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
